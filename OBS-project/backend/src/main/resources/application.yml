spring:
  application:
    name: sms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms}
    username: ${DB_USER:sms}
    password: ${DB_PASSWORD:sms_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: strict
  compression:
    enabled: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    jwt:
      issuer: turggut-sms
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
      secret: ${JWT_SECRET:Q2hhbmdlTWVJbVByb2R1Y3Rpb25QbGVhc2VBVmVyeUxvbmdTZWNyZXRLZXk2NEJ5dGVzMTIzNDU2Nzg5MA==}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    rate-limit:
      auth-requests-per-minute: 5
      api-requests-per-minute: 120
    password:
      min-length: 8
      lockout-threshold: 5
      lockout-duration-minutes: 15
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USER:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin!2345}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@turggut.local}

logging:
  level:
    root: INFO
    com.turggut.sms: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{user:-anon}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
