spring:
  datasource:
    url: jdbc:h2:mem:smsTest;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc.time_zone: UTC

app:
  security:
    jwt:
      issuer: turggut-sms
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
      secret: VGVzdFNlY3JldEtleVRoYXRJc0xvbmdFbm91Z2hUb1NhdGlzZnlSZXF1aXJlbWVudHNGb3JKV1RIUw==
    cors:
      allowed-origins: http://localhost:5173
    rate-limit:
      auth-requests-per-minute: 100000
      api-requests-per-minute: 100000
    password:
      min-length: 8
      lockout-threshold: 5
      lockout-duration-minutes: 15
  bootstrap:
    admin-username: admin
    admin-password: Admin!2345
    admin-email: admin@test.local
