services:
  db:
    image: postgres:16-alpine
    container_name: obs-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - obs-net

  backend:
    build:
      context: ./backend
    container_name: obs-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Spring relaxed binding maps these onto spring.datasource.* at runtime,
      # overriding the localhost defaults baked into application.yml.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Must be at least 32 bytes once base64-decoded. Override in production.
      JWT_SECRET: ${JWT_SECRET:-Q2hhbmdlTWVJbVByb2R1Y3Rpb25QbGVhc2VBVmVyeUxvbmdTZWNyZXRLZXk2NEJ5dGVzMTIzNDU2Nzg5MA==}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin!2345}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@turggut.local}
    ports:
      - "8080:8080"
    networks:
      - obs-net

  frontend:
    build:
      context: ./frontend
    container_name: obs-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - obs-net

volumes:
  db-data:

networks:
  obs-net:
    driver: bridge
